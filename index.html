<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="card">
        <div class="search">
            <!-- Added correct ID for the search button -->
            <input type="text" placeholder="Enter city name" spellcheck="false">
            <button id="searchButton"><img src="/search.png" alt="search"></button>
        </div>
        <div>
            <img src="/rain.png" alt="images" class="weather-icon">
            <h1 class="temp">22°C</h1>
            <h2 class="city">New York</h2>
            <div class="details">
                <div class="col">
                    <img src="/humidity.png" alt="">
                    <div>
                        <p class="humidity">50%</p>
                        <p>Humidity</p>
                    </div>
                </div>
                <div class="col">
                    <img src="/wind.png" alt="">
                    <div>
                        <p class="wind">15 km/h</p>
                        <p>Wind Speed</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
     
        const apikey = "265d78e5b970824edd0f09dd6d60257c";
        const apiurl = "https://api.openweathermap.org/data/2.5/weather?units=metric&q="; // Corrected 'matric' to 'metric'

       
        const searchbox = document.querySelector(".search input");
        const searchBtn = document.querySelector("#searchButton"); 
        const weatherIcon = document.querySelector(".weather-icon");
        
       
        async function checkWeather(city) {
           
            const response = await fetch(apiurl + city + `&appid=${apikey}`);
            var data = await response.json();

            // console.log(data);

            // Updating the DOM with weather data
            document.querySelector(".city").innerHTML = data.name;
            document.querySelector(".temp").innerHTML = Math.round(data.main.temp) + "°C"; // Corrected 'math' to 'Math'
            document.querySelector(".humidity").innerHTML = data.main.humidity + "%";
            document.querySelector(".wind").innerHTML = data.wind.speed + " km/h";

            // Updating the weather icon based on condition
            if (data.weather[0].main === "Clouds") {
                weatherIcon.src = "clouds.png";
            } else if (data.weather[0].main === "Clear") {
                weatherIcon.src = "clear.png";
            } else if (data.weather[0].main === "Rain") {
                weatherIcon.src = "rain.png";
            } else if (data.weather[0].main === "Snow") {
                weatherIcon.src = "snow.png";
            } else if (data.weather[0].main === "Drizzle") {
                weatherIcon.src = "drizzle.png";
            } else if (data.weather[0].main === "Mist") {
                weatherIcon.src = "mist.png";
            }
        }

        // Event listener for the search button
        searchBtn.addEventListener("click", async () => {
            await checkWeather(searchbox.value); // Added 'await' keyword
        });
    </script>
</body>
</html>
